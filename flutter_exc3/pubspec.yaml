name: entregas_app
description: App de controle de entregas com SQLite e GPS

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Banco de dados local
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0

  # GPS / Geolocalização
  geolocator: ^13.0.1

  # Ícones extras
  cupertino_icons: ^1.0.6
  firebase_core: ^4.10.0
  firebase_database: ^12.4.2
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/logo_full.png
